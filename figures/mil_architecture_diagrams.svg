<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840">
  <defs>
    <style type="text/css">
      <![CDATA[
        .title { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #111; text-anchor: middle; }
        .subtitle { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 10px; fill: #333; text-anchor: middle; font-style: italic; }
        .label { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px; fill: #111; text-anchor: middle; }
        .small { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 9px; fill: #111; text-anchor: middle; }
        .micro { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8px; fill: #333; text-anchor: middle; }
        .io { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #111; text-anchor: middle; }
        .modhead { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #222; text-anchor: middle; }
        .box { fill: #fff; stroke: #111; stroke-width: 1.4; }
        .module { fill: #ececec; stroke: #111; stroke-width: 1.2; }
        .module-attn { fill: #f4e8ec; stroke: #111; stroke-width: 1.3; }
        .arrow { stroke: #111; stroke-width: 1.2; fill: none; marker-end: url(#arrowhead); }
        .arrow-dash { stroke: #111; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrowhead); }
        .op { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; fill: #111; text-anchor: middle; font-weight: 600; }
      ]]>
    </defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#111"/>
  </marker>

  <!-- Column 0: Attention MIL — generous spacing; labels inside callouts (matches mil/model.py) -->
  <g>
    <text x="160" y="28" class="title">Attention MIL</text>
    <text x="160" y="46" class="subtitle">Ilse et al.-style · defaults from AttentionMIL</text>
    <text x="160" y="72" class="io">Bag of features</text>
    <text x="160" y="86" class="micro">x [B, N, D] · padding mask for variable N</text>
    <line x1="160" y1="92" x2="160" y2="110" class="arrow"/>

    <rect x="65" y="112" width="190" height="36" class="box" rx="2"/>
    <text x="160" y="130" class="label">Linear (D &#8594; H)</text>
    <text x="160" y="142" class="micro">default H = 128 (train arg)</text>
    <line x1="160" y1="148" x2="160" y2="168" class="arrow"/>

    <rect x="85" y="170" width="150" height="28" class="box" rx="2"/>
    <text x="160" y="187" class="label">ReLU</text>
    <line x1="160" y1="198" x2="160" y2="218" class="arrow"/>

    <rect x="85" y="220" width="150" height="36" class="box" rx="2"/>
    <text x="160" y="238" class="label">Dropout</text>
    <text x="160" y="250" class="micro">p = 0.25</text>

    <!-- Skip callout (room to read; not flush on box) -->
    <rect x="246" y="208" width="92" height="48" class="box" rx="6" stroke-dasharray="4 3"/>
    <text x="292" y="226" class="small">Skip</text>
    <text x="292" y="239" class="micro">same h</text>
    <text x="292" y="250" class="micro">[B, N, H]</text>
    <path d="M 235 238 L 246 238" class="arrow"/>

    <line x1="160" y1="256" x2="160" y2="280" class="arrow"/>
    <text x="160" y="294" class="micro">h [B, N, H] into attention MLP</text>
    <path d="M 235 256 L 308 256 L 308 690 L 186 690" class="arrow"/>

    <rect x="14" y="306" width="292" height="324" class="module-attn" rx="14"/>
    <text x="160" y="328" class="modhead">Instance attention</text>
    <text x="160" y="344" class="micro">encoder output h · tensor shape after each op</text>

    <rect x="44" y="354" width="232" height="34" class="box" rx="2"/>
    <text x="160" y="372" class="small">Linear (H &#8594; 64)</text>
    <text x="160" y="384" class="micro">[B, N, H] &#8594; [B, N, 64]</text>
    <line x1="160" y1="388" x2="160" y2="408" class="arrow"/>

    <rect x="44" y="410" width="232" height="34" class="box" rx="2"/>
    <text x="160" y="428" class="small">Tanh</text>
    <text x="160" y="440" class="micro">[B, N, 64]</text>
    <line x1="160" y1="444" x2="160" y2="464" class="arrow"/>

    <rect x="44" y="466" width="232" height="34" class="box" rx="2"/>
    <text x="160" y="484" class="small">Linear (64 &#8594; 1)</text>
    <text x="160" y="496" class="micro">squeeze &#8594; logits a [B, N]</text>
    <line x1="160" y1="500" x2="160" y2="520" class="arrow"/>

    <rect x="34" y="522" width="252" height="46" class="box" rx="2"/>
    <text x="160" y="540" class="micro">_mask_fill (~mask, torch.finfo.min)</text>
    <text x="160" y="554" class="micro">softmax(a, dim=1) · weights sum to 1 over N per bag</text>

    <line x1="160" y1="568" x2="160" y2="588" class="arrow"/>
    <rect x="44" y="590" width="232" height="28" class="box" rx="2"/>
    <text x="160" y="608" class="small">A attention weights [B, N]</text>

    <!-- Outside pink: long drop + pooling (legend left, op text right — no text on arrow) -->
    <line x1="160" y1="618" x2="160" y2="652" class="arrow"/>
    <text x="232" y="638" class="micro" text-anchor="start">weighted bag pool</text>

    <rect x="18" y="632" width="118" height="54" class="box" rx="6" stroke="#444" stroke-width="1"/>
    <text x="77" y="648" class="micro">Pool inputs</text>
    <text x="77" y="660" class="micro">A · main stem</text>
    <text x="77" y="672" class="micro">h · skip rail</text>

    <text x="198" y="640" class="micro" text-anchor="start">(a.unsqueeze(-1) * h)</text>
    <text x="198" y="654" class="micro" text-anchor="start">.sum(dim=1)</text>
    <text x="198" y="668" class="micro" text-anchor="start">&#8594; bag [B, H]</text>

    <line x1="160" y1="652" x2="160" y2="674" class="arrow"/>
    <circle cx="160" cy="690" r="21" fill="#fff" stroke="#111" stroke-width="1.4"/>
    <text x="160" y="686" class="op">&#215;</text>
    <text x="160" y="702" class="op" font-size="13">&#931;</text>

    <line x1="160" y1="711" x2="160" y2="732" class="arrow"/>
    <rect x="70" y="734" width="180" height="32" class="box" rx="2"/>
    <text x="160" y="752" class="label">Linear (H &#8594; #classes)</text>
    <text x="160" y="764" class="micro">e.g. 6 ISUP</text>
    <line x1="160" y1="768" x2="160" y2="788" class="arrow"/>
    <text x="160" y="808" class="io">Classification</text>
  </g>

  <!-- Column 1: Gated Attention MIL -->
  <g transform="translate(320,0)">
    <text x="160" y="28" class="title">Gated Attention MIL</text>
    <text x="160" y="46" class="subtitle">two-branch gated attention</text>
    <text x="160" y="78" class="io">Bag of features</text>
    <line x1="160" y1="84" x2="160" y2="98" class="arrow"/>
    <rect x="85" y="100" width="150" height="26" class="box" rx="2"/>
    <text x="160" y="117" class="label">Linear</text>
    <line x1="160" y1="126" x2="160" y2="140" class="arrow"/>
    <rect x="85" y="142" width="150" height="26" class="box" rx="2"/>
    <text x="160" y="159" class="label">LayerNorm</text>
    <line x1="160" y1="168" x2="160" y2="182" class="arrow"/>
    <rect x="85" y="184" width="150" height="26" class="box" rx="2"/>
    <text x="160" y="201" class="label">GELU</text>
    <line x1="160" y1="210" x2="160" y2="224" class="arrow"/>
    <rect x="85" y="226" width="150" height="26" class="box" rx="2"/>
    <text x="160" y="243" class="label">Dropout</text>
    <line x1="160" y1="252" x2="160" y2="266" class="arrow"/>

    <rect x="35" y="268" width="250" height="130" class="module" rx="10"/>
    <text x="160" y="288" class="small">Gated attention</text>
    <rect x="50" y="295" width="95" height="22" class="box" rx="2"/>
    <text x="97" y="310" class="small">Linear V</text>
    <line x1="97" y1="317" x2="97" y2="327" class="arrow"/>
    <rect x="50" y="329" width="95" height="22" class="box" rx="2"/>
    <text x="97" y="344" class="small">Tanh</text>
    <rect x="175" y="295" width="95" height="22" class="box" rx="2"/>
    <text x="222" y="310" class="small">Linear U</text>
    <line x1="222" y1="317" x2="222" y2="327" class="arrow"/>
    <rect x="175" y="329" width="95" height="22" class="box" rx="2"/>
    <text x="222" y="344" class="small">Sigmoid</text>
    <line x1="97" y1="363" x2="127" y2="363" class="arrow"/>
    <line x1="222" y1="363" x2="192" y2="363" class="arrow"/>
    <circle cx="160" cy="363" r="12" fill="#fff" stroke="#111" stroke-width="1.4"/>
    <text x="160" y="368" class="op">&#183;</text>
    <line x1="160" y1="375" x2="160" y2="385" class="arrow"/>
    <rect x="95" y="387" width="130" height="22" class="box" rx="2"/>
    <text x="160" y="402" class="small">Linear w (score)</text>

    <path d="M 160 252 L 285 252 L 285 434 L 174 434" class="arrow"/>
    <text x="268" y="248" class="small">h</text>
    <line x1="160" y1="409" x2="160" y2="418" class="arrow"/>
    <circle cx="160" cy="434" r="14" fill="#fff" stroke="#111" stroke-width="1.4"/>
    <text x="160" y="439" class="op">&#215;</text>
    <text x="200" y="432" class="small">sum (bag)</text>
    <line x1="160" y1="448" x2="160" y2="462" class="arrow"/>
    <rect x="85" y="464" width="150" height="26" class="box" rx="2"/>
    <text x="160" y="481" class="label">Linear</text>
    <line x1="160" y1="490" x2="160" y2="506" class="arrow"/>
    <text x="160" y="524" class="io">Classification</text>
  </g>

  <!-- Column 2: Ordinal MIL -->
  <g transform="translate(640,0)">
    <text x="160" y="28" class="title">Ordinal MIL</text>
    <text x="160" y="46" class="subtitle">global pool + top-k pool</text>
    <text x="160" y="78" class="io">Bag of features</text>
    <line x1="160" y1="84" x2="160" y2="98" class="arrow"/>
    <rect x="55" y="100" width="210" height="24" class="box" rx="2"/>
    <text x="160" y="117" class="small">Encoder: Lin, LN, GELU, Dropout</text>
    <line x1="160" y1="124" x2="160" y2="138" class="arrow"/>

    <rect x="35" y="140" width="250" height="118" class="module" rx="10"/>
    <text x="160" y="158" class="small">Gated attention (as in Gated MIL)</text>
    <rect x="70" y="168" width="180" height="68" class="box" rx="2"/>
    <text x="160" y="190" class="small">Tanh / Sigmoid branches</text>
    <text x="160" y="204" class="small">element product &#183; Linear</text>
    <text x="160" y="224" class="small">masked softmax &#8594; A</text>

    <line x1="160" y1="258" x2="160" y2="272" class="arrow"/>
    <line x1="160" y1="265" x2="80" y2="265" class="arrow"/>
    <line x1="160" y1="265" x2="240" y2="265" class="arrow"/>
    <line x1="80" y1="265" x2="80" y2="282" class="arrow"/>
    <rect x="30" y="284" width="100" height="40" class="box" rx="2"/>
    <text x="80" y="302" class="small">Global bag</text>
    <text x="80" y="316" class="small">A &#8855; h sum</text>

    <rect x="185" y="274" width="110" height="26" class="box" rx="2"/>
    <text x="240" y="291" class="small">Top-k by A</text>
    <line x1="240" y1="300" x2="240" y2="312" class="arrow"/>
    <rect x="190" y="314" width="100" height="40" class="box" rx="2"/>
    <text x="240" y="330" class="small">gather h,</text>
    <text x="240" y="344" class="small">mean, GELU proj</text>

    <line x1="80" y1="324" x2="80" y2="354" class="arrow"/>
    <line x1="240" y1="354" x2="240" y2="368" class="arrow"/>
    <line x1="80" y1="368" x2="240" y2="368" class="arrow"/>
    <rect x="115" y="368" width="90" height="22" class="box" rx="2"/>
    <text x="160" y="383" class="small">concat</text>
    <line x1="160" y1="390" x2="160" y2="404" class="arrow"/>
    <rect x="70" y="406" width="180" height="26" class="box" rx="2"/>
    <text x="160" y="423" class="label">Fused</text>
    <line x1="160" y1="432" x2="110" y2="450" class="arrow"/>
    <line x1="160" y1="432" x2="210" y2="450" class="arrow"/>
    <rect x="45" y="452" width="130" height="34" class="box" rx="2"/>
    <text x="110" y="468" class="small">Ordinal logits</text>
    <text x="110" y="480" class="small">+ coral bias</text>
    <rect x="145" y="452" width="130" height="34" class="box" rx="2"/>
    <text x="210" y="468" class="small">CE logits</text>
    <text x="210" y="480" class="small">6-class</text>
    <line x1="110" y1="486" x2="110" y2="500" class="arrow"/>
    <line x1="210" y1="486" x2="210" y2="500" class="arrow"/>
    <line x1="110" y1="500" x2="160" y2="508" class="arrow"/>
    <line x1="210" y1="500" x2="160" y2="508" class="arrow"/>
    <text x="160" y="528" class="io">Classification</text>
  </g>

  <!-- Column 3: CLAM-SB -->
  <g transform="translate(960,0)">
    <text x="160" y="28" class="title">CLAM-SB</text>
    <text x="160" y="46" class="subtitle">Lu et al.; dashed = instance loss</text>
    <text x="160" y="78" class="io">Bag of features</text>
    <line x1="160" y1="84" x2="160" y2="98" class="arrow"/>
    <rect x="85" y="100" width="150" height="26" class="box" rx="2"/>
    <text x="160" y="117" class="label">Linear</text>
    <line x1="160" y1="126" x2="160" y2="140" class="arrow"/>
    <rect x="85" y="142" width="150" height="26" class="box" rx="2"/>
    <text x="160" y="159" class="label">ReLU</text>
    <line x1="160" y1="168" x2="160" y2="182" class="arrow"/>
    <rect x="85" y="184" width="150" height="26" class="box" rx="2"/>
    <text x="160" y="201" class="label">Dropout</text>
    <line x1="160" y1="210" x2="160" y2="224" class="arrow"/>

    <rect x="40" y="226" width="240" height="128" class="module" rx="10"/>
    <text x="160" y="246" class="small">Calculate attention weights</text>
    <rect x="55" y="254" width="95" height="22" class="box" rx="2"/>
    <text x="102" y="269" class="small">Linear</text>
    <line x1="102" y1="276" x2="102" y2="286" class="arrow"/>
    <rect x="55" y="288" width="95" height="22" class="box" rx="2"/>
    <text x="102" y="303" class="small">Tanh</text>
    <rect x="170" y="254" width="95" height="22" class="box" rx="2"/>
    <text x="217" y="269" class="small">Linear</text>
    <line x1="217" y1="276" x2="217" y2="286" class="arrow"/>
    <rect x="170" y="288" width="95" height="22" class="box" rx="2"/>
    <text x="217" y="303" class="small">Sigmoid</text>
    <line x1="102" y1="322" x2="132" y2="322" class="arrow"/>
    <line x1="217" y1="322" x2="187" y2="322" class="arrow"/>
    <circle cx="160" cy="322" r="11" fill="#fff" stroke="#111" stroke-width="1.4"/>
    <text x="160" y="327" class="op">&#183;</text>
    <line x1="160" y1="333" x2="160" y2="343" class="arrow"/>
    <rect x="95" y="345" width="130" height="22" class="box" rx="2"/>
    <text x="160" y="360" class="small">Linear (score)</text>

    <path d="M 160 210 L 290 210 L 290 408 L 174 408" class="arrow"/>
    <text x="272" y="214" class="small">h</text>
    <line x1="160" y1="367" x2="160" y2="394" class="arrow"/>
    <circle cx="160" cy="408" r="14" fill="#fff" stroke="#111" stroke-width="1.4"/>
    <text x="160" y="413" class="op">&#215;</text>
    <text x="200" y="402" class="small">A &#8855; h, sum</text>
    <text x="200" y="428" class="small">slide M</text>
    <line x1="160" y1="422" x2="160" y2="436" class="arrow"/>
    <rect x="85" y="438" width="150" height="26" class="box" rx="2"/>
    <text x="160" y="455" class="label">Linear (bag)</text>
    <line x1="160" y1="464" x2="160" y2="480" class="arrow"/>
    <text x="160" y="500" class="io">Classification</text>

    <path d="M 35 322 L 15 322 L 15 478 L 75 478" class="arrow-dash"/>
    <rect x="10" y="482" width="148" height="38" class="box" rx="2" stroke-dasharray="5 4"/>
    <text x="84" y="498" class="small">Instance classifiers</text>
    <text x="84" y="512" class="small">k-sample CE (train)</text>
  </g>
</svg>
