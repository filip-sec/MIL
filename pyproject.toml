[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mil"
version = "0.1.0"
description = "MIL models and utilities for PANDA WSI grading"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "h5py>=3.7",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]
preproc = [
    "pillow>=8.0.0",
    "opencv-python>=4.5.0",
    "openslide-python>=1.1.2",
    "tqdm>=4.60.0",
    "numba>=0.56.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mil*", "crc_preproc*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mil"]
