[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mil"
version = "0.1.0"
description = "MIL models and utilities for PANDA WSI grading"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "h5py>=3.7",
    "scikit-learn>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mil*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mil"]
